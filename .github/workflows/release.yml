name: Release

# Tag a version to ship it:
#   1. write the CHANGELOG.md section for the new version
#   2. npm run release -- <beta|stable|patch|minor|major|x.y.z>
#
# scripts/release.ts does the bump, the commit, the annotated tag and the push,
# and runs the checks below locally first. The steps here repeat them anyway: a
# tag can also arrive by hand.
on:
  push:
    tags:
      - 'v*'

# electron-builder creates the GitHub release and uploads the installer with the
# built-in token. Without this it builds for six minutes and then 403s.
permissions:
  contents: write

# One build per tag, and never cancelled: a half-published release keeps some of
# its assets, which the updater will happily read and then fail to download from.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # Node 24 because tests/store.test.ts runs under plain Node and
      # src/main/lib/store.ts imports node:sqlite, which needs no flag only from
      # Node 22.13 on. Electron bundles its own Node, so this constrains the test
      # step rather than the app.
      #
      # Pinned to an exact patch, not '24', because the bundled npm is what
      # resolves the tree: app-builder-lib pulls electron-winstaller as an
      # optional *peer*, and npm versions disagree on which release of it to
      # take. A newer npm picks one that needs @electron/windows-sign, which this
      # lockfile does not carry, and `npm ci` then fails the sync check. Bump this
      # and regenerate package-lock.json together, never one alone.
      - uses: actions/setup-node@v5
        with:
          node-version: '24.9.0'
          cache: 'npm'

      # Both caches below key off the dependency graph rather than the lockfile
      # itself. A release commit bumps the version inside package-lock.json, so
      # hashFiles() on it would miss on every single release — the one run that
      # can least afford a cold install.
      - name: Fingerprint the dependency graph
        id: deps
        shell: bash
        run: |
          hash=$(jq -S 'del(.version) | del(.packages[""].version)' package-lock.json | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Dependency graph: $hash"

      # A hit skips `npm ci` entirely. The expensive part on Windows is writing
      # the tree, not fetching it: ~1 GB across 200k files, most of it Electron
      # and the media binaries. No restore-keys — a tree resolved from a
      # different lockfile is not a partial hit, it is the wrong tree.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # The Node version is part of the key by hand: a tree installed by one
          # major can carry the wrong prebuilt binaries for another. Bump it with
          # node-version above.
          key: ${{ runner.os }}-node24.9.0-modules-${{ steps.deps.outputs.hash }}

      # Belt and braces: setup-node's bundled npm has changed within a patch
      # release before, and the lockfile is only valid for the resolver that
      # wrote it. Only matters on a run that actually installs.
      - name: Pin npm to the version that resolved package-lock.json
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm i -g npm@11.6.0

      # ~200 MB of Electron zip plus electron-builder's nsis/winCodeSign
      # resources, re-downloaded on every cold run otherwise. Needed even when
      # node_modules is restored: the nsis resources are fetched at packaging time.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ steps.deps.outputs.hash }}
          restore-keys: ${{ runner.os }}-electron-

      # electron-builder names artifacts from package.json and the updater
      # compares against app.getVersion(). A tag that disagrees would ship a
      # build that can never be offered as an update to anyone.
      - name: Verify tag matches package.json
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            Write-Host "::error::Tag '$tag' does not match package.json version '$version'. Bump package.json, commit, then re-tag."
            exit 1
          }
          Write-Host "Building Sift $version from $tag"

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # Fails when CHANGELOG.md has no section for this version, so a release can
      # never ship untitled. Deliberately before the build: seconds, not minutes.
      - name: Extract release notes
        run: npm run release:notes

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # electron-builder uploads artifacts concurrently, and each upload creates
      # the release when it cannot find one. Two uploads finishing in the same
      # instant therefore produce *two* releases sharing a tag, with the assets
      # split between them — and GitHub then cannot resolve
      # /releases/download/<tag>/latest.yml at all. It 404s, and every installed
      # copy reports "No update feed for this build yet".
      #
      # Creating the release first makes electron-builder's lookup succeed, so it
      # only ever uploads. Idempotent, so a re-run of a failed job is safe.
      - name: Create the release up front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — electron-builder will upload into it."
            exit 0
          fi
          # A prerelease version carries a suffix; a stable one becomes "Latest".
          if [[ "$tag" == *-* ]]; then flag=--prerelease; else flag=--latest; fi
          gh release create "$tag" "$flag" --title "${tag#v}" --notes-file build/release-notes.md

      # release:ci, not release:win: the latter runs `npm run build`, which
      # typechecks all over again — the step above already did that.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:ci

      # Not the installer — that is already on the release, and a second copy of
      # 160 MB buys nothing. This is what you need to debug a failed update.
      - name: Upload update metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-metadata
          path: |
            dist/*.yml
            dist/*.blockmap
          retention-days: 7
          if-no-files-found: warn
