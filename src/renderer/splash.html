<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Sift</title>
    <!-- Same lockdown as index.html, minus the routes the splash has no use for:
         no clip: scheme, no media. connect-src keeps the dev server's HMR socket. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div class="splash">
      <span class="mark" aria-hidden="true">
        <!-- The app icon (build/icon.png) redrawn in theme colours: the "slats"
             play triangle on its gradient tile, the last bar fallen through in
             the accent. Same 512 geometry as the PNG so the two match. -->
        <svg viewBox="0 0 512 512" width="60" height="60">
          <defs>
            <linearGradient id="splash-mark" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color: var(--secondary)" />
              <stop offset="1" style="stop-color: var(--primary)" />
            </linearGradient>
            <clipPath id="splash-slats">
              <rect x="0" y="12" width="64" height="8" />
              <rect x="0" y="22.5" width="64" height="8" />
              <rect x="0" y="33" width="64" height="8" />
            </clipPath>
            <clipPath id="splash-slat-last">
              <rect x="0" y="43.5" width="64" height="9" />
            </clipPath>
          </defs>
          <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#splash-mark)" />
          <svg x="82" y="82" width="348" height="348" viewBox="0 0 64 64">
            <path
              d="M17 12 L51 32 L17 52 Z"
              clip-path="url(#splash-slats)"
              style="fill: var(--on-primary)"
            />
            <path
              d="M17 12 L51 32 L17 52 Z"
              clip-path="url(#splash-slat-last)"
              transform="translate(5 1)"
              style="fill: var(--accent)"
            />
          </svg>
        </svg>
      </span>

      <h1 class="wordmark">
        <span style="--i: 0">S</span><span style="--i: 1">i</span><span style="--i: 2">f</span
        ><span style="--i: 3">t</span>
      </h1>
      <p class="tagline">Local-first clip library</p>

      <div class="progress" role="progressbar" aria-label="Starting Sift">
        <span class="bar"></span>
      </div>
      <p id="status" class="status" aria-live="polite">Starting up…</p>

      <p id="version" class="version mono" hidden></p>
    </div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
