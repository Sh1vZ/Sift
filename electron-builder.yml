appId: com.sift.app
productName: Sift
copyright: Copyright © 2026
directories:
  buildResources: build
  output: dist
files:
  # The three build outputs only — `out/**` also swept in the bundled test and
  # release-notes scripts, which have no business in a shipped app.
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
# The tray builds its icon from a real file, and 'files' above does not ship build/.
extraResources:
  - from: build/icon.png
    to: icon.png
  # Read at launch for the one-time "What's new" after the app updates itself, so
  # the notes for the running build do not depend on the network.
  - from: CHANGELOG.md
    to: CHANGELOG.md
# The ffmpeg and ffprobe executables have to be real files on disk for
# child_process to spawn them. @ffprobe-installer resolves its own path through
# require, which lands inside the archive; lib/paths.ts rewrites that to the
# unpacked copy.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/@ffprobe-installer/**
npmRebuild: false
# Electron ships 55 locale .pak files, ~48 MB, and Sift's UI is English-only.
# Worth 7.7 MB of the installer. Note the matching is exact-ish: 'en' would drop
# en-US.pak rather than keep it, so name the full locale.
electronLanguages:
  - en-US

# electron-builder infers a GitHub provider from the git remote, but the inferred
# default is `releaseType: draft` — and a draft release is invisible to
# electron-updater, so the app would silently report "up to date" forever.
#
# The GitHub provider has no named update channels: it always writes latest.yml
# and expresses "beta" through the release's own prerelease flag, which the app
# opts into with `allowPrerelease` (see src/main/lib/updater.ts). Setting
# `channel:` here, or `generateUpdatesFilesForAllChannels`, does nothing for this
# provider. Promoting the beta line to stable is a one-word change below.
publish:
  provider: github
  owner: Sh1vZ
  repo: Sift
  releaseType: prerelease

# Written by `npm run release:notes` from the CHANGELOG section for this version.
# Becomes the GitHub release body and the manifest's releaseNotes. A local build
# without it simply ships no notes.
releaseInfo:
  releaseNotesFile: build/release-notes.md

win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Sift
  createDesktopShortcut: always
